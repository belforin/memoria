defaults:
  - agent: dt
  - override hydra/launcher: submitit_local

# dataset settings (D4RL, sin dmc/dm_control)
task: halfcheetah_expert
obs_dim: 17
action_dim: 6
discount: 0.99
# train settings
num_grad_steps: 400010
log_every_steps: 1000
# eval
eval_every_steps: 10000
num_eval_episodes: 10
# snapshot
snapshots: [0, 100000, 200000, 300000, 350000, 400000, 450000, 500000, 550000, 600000]
snapshot_dir: ../../../snapshot/${pretrained_data}
# resume
resume: false
resume_dir: none
resume_step: 0
# dataset
replay_buffer_dir: data/halfcheetah_expert
replay_buffer_size: 100000000
replay_buffer_num_workers: 16
batch_size: ${agent.batch_size}
# misc
seed: 1
device: cuda
use_tb: true
use_wandb: true
project: mdp
notes: "pretrain_dt"
exp_name: output


hydra:
  run:
    dir: /path/to/your/models/${exp_name}/${now:%Y.%m.%d}/${now:%H%M%S}_${agent.name}
