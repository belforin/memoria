# @package agent
# BC autoregresivo sin return-to-go, topologia jerarquica, DMC propioceptivo
# (belforin/memoria, METODOLOGIA_DT_HDT.md seccion 7.6). Hiperparametros de
# la etapa propioceptiva de la tesis de Benjamin (Tablas 3.2 y 3.3): lr 1e-4,
# batch 384, contexto 64, 4 heads, sin dropout ni weight decay.
_target_: agent.bc_ar.BCARAgent
name: bc_hier
obs_shape: ???
action_shape: ???
device: ${device}
lr: 1e-4
use_tb: ${use_tb}
batch_size: 384
transformer_cfg:
  topology: hier
  n_embd: 256
  n_head: 4
  n_obs_layer: 2      # stream de estados (sus 2 capas de encoder por modalidad)
  n_act_layer: 2      # stream de acciones
  n_layer: 1          # bloque conjunto (su capa de fusion)
  traj_length: 64
  embd_pdrop: 0.0
  attn_pdrop: 0.0
  resid_pdrop: 0.0
  mlp_pdrop: 0.0
  weight_decay: 0.0
  use_pixel_obs: false
  discrete_actions: false
  # solo los lee pretrain.py para su archivo wandb_info.txt; el modelo no los usa
  modality_dropout: false
  modality_dropout_prob: 0.0
